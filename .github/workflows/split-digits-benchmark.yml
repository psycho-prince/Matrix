name: Split Digits Continual Learning Smoke Benchmark

on:
  workflow_dispatch:
    inputs:
      seeds:
        description: "Number of deterministic seeds"
        required: true
        default: "3"
      epochs:
        description: "Epochs per task"
        required: true
        default: "8"

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --upgrade pip torch scikit-learn numpy
      - name: Run deterministic benchmark
        run: |
          python experiments/09_split_digits/run_benchmark.py \
            --seeds "${{ inputs.seeds }}" \
            --epochs "${{ inputs.epochs }}"
      - uses: actions/upload-artifact@v4
        with:
          name: split-digits-results
          path: experiments/09_split_digits/results.json
          if-no-files-found: error
          retention-days: 30
