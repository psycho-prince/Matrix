name: Canonical Split-MNIST Research Benchmark

on:
  push:
    branches: [ "research/canonical-split-mnist-baselines" ]
  workflow_dispatch:
    inputs:
      seeds:
        description: "Paired seeds (pilot default 20)"
        required: false
        default: "20"
      device:
        description: "cpu or cuda"
        required: false
        default: "cpu"

permissions:
  contents: read

jobs:
  split-mnist:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU PyTorch and scientific stack
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install numpy scipy
      - name: Recompute original 100-seed GAL experiment
        run: python analysis/audit_original_100_seeds.py
      - name: Run canonical MNIST continual-learning benchmark
        run: |
          python experiments/05_neural_continual_learning/canonical_split_mnist.py --seeds "${{ github.event.inputs.seeds || '20' }}" --device "${{ github.event.inputs.device || 'cpu' }}"
      - name: Paired statistics and power analysis
        run: python analysis/analyze_canonical_split_mnist.py
      - name: Upload raw results and audit reports
        uses: actions/upload-artifact@v4
        with:
          name: gal-continual-learning-results
          path: |
            data/results/original_100_seed_audit.json
            data/mnist/canonical_split_mnist_results.json
            data/mnist/canonical_split_mnist_statistics.json
          if-no-files-found: error
