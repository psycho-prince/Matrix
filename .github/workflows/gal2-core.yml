name: GAL 2.0 Parallel Test and Validation

on:
  push:
    branches: [research/gal-2.0-core]
    paths:
      - 'gal2/**'
      - '.github/workflows/gal2-core.yml'
  pull_request:
    paths:
      - 'gal2/**'
      - '.github/workflows/gal2-core.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: gal2/pyproject.toml
      - name: Install package and test dependencies
        working-directory: gal2
        run: python -m pip install -e '.[test]'
      - name: Run unit tests
        working-directory: gal2
        run: python -m pytest -q

  static-validation:
    name: Static and source validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile all Python modules
        run: python -m compileall -q gal2
      - name: Verify source imports
        run: |
          python -c "import gal2; from gal2.adaptive_inheritance import adaptive_inherit; from gal2.validation import run_validation; print('source imports: OK')"

  mechanism-validation:
    name: Adaptive inheritance mechanism validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run deterministic mechanism validation
        run: python -m gal2.validation --seed 20261104 --output gal2/validation-report.json
      - name: Upload validation report
        uses: actions/upload-artifact@v4
        with:
          name: gal2-mechanism-validation
          path: gal2/validation-report.json
          if-no-files-found: error

  baseline-comparison:
    name: Paired inheritance baseline experiment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run paired 100-seed comparison
        run: python -m gal2.comparison --seed-start 1000 --seeds 100 --test-trials 250 --output gal2/gal2-comparison.json
      - name: Upload raw results and summary
        uses: actions/upload-artifact@v4
        with:
          name: gal2-inheritance-baseline-comparison
          path: gal2/gal2-comparison.json
          if-no-files-found: error

  knowledge-question-benchmark:
    name: Knowledge processing and question creation benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run bidirectional benchmark
        run: python -m gal2.knowledge_questions > gal2/knowledge-question-report.json
      - name: Upload benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: gal2-knowledge-question-benchmark
          path: gal2/knowledge-question-report.json
          if-no-files-found: error

  knowledge-question-stress-tests:
    name: Five knowledge-question stress tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run five stress tests
        run: python -m gal2.knowledge_question_stress > gal2/knowledge-question-stress-report.json
      - name: Upload stress-test report
        uses: actions/upload-artifact@v4
        with:
          name: gal2-five-knowledge-question-stress-tests
          path: gal2/knowledge-question-stress-report.json
          if-no-files-found: error
